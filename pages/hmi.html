<section class="page hmi-page">
  <div class="page-title-row">
    <div>
      <h1>HMI 빌더</h1>
      <p>디바이스 값을 그래픽 화면으로 표시·조작합니다. (데모 프로젝트)</p>
    </div>
    <div class="hmi-status">
      <span class="hmi-status-dot" id="hmiDot"></span>
      <span id="hmiMsg">로딩 중…</span>
      <button class="btn ghost hmi-fs-btn" type="button" id="hmiFullscreenBtn">⛶ 전체 화면</button>
      <!-- Manager 이상만 보임(화면 저장 API 권한이 ManagerOrAbove) -->
      <button class="btn ghost hmi-fs-btn" type="button" id="hmiDesignBtn" hidden>✎ 디자인</button>
    </div>
  </div>

  <div id="pageContent" hidden>
    <article class="panel hmi-stage-panel">
      <div id="hmiStage" class="hmi-stage"></div>
      <!-- 전체 화면일 때만 보임 — Esc 키가 없는 터치 패널용 종료 버튼 -->
      <button class="hmi-fs-exit" type="button" id="hmiFsExit" title="전체 화면 종료">✕</button>
    </article>
  </div>

  <!-- 디자인 모드 — whmi-editor.js가 내용을 채운다 -->
  <div id="hmiEditor" class="hmi-editor" hidden></div>
</section>
