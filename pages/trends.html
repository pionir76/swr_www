<section class="page trends-page">

  <!-- ── 컨트롤 바 ──────────────────────────────────────────────── -->
  <div class="trends-toolbar">
    <button class="trends-nav-arrow" id="trendPrevBtn">&#8592;</button>
    <div class="trends-range-group" id="trendsRangeGroup">
      <button class="trends-range-btn" data-range="1h">1h</button>
      <button class="trends-range-btn" data-range="6h">6h</button>
      <button class="trends-range-btn active" data-range="24h">24h</button>
      <button class="trends-range-btn" data-range="7d">7d</button>
      <button class="trends-range-btn" data-range="30d">30d</button>
      <button class="trends-range-btn" data-range="1y">1y</button>
    </div>
    <button class="trends-nav-arrow" id="trendNextBtn">&#8594;</button>
  </div>

  <!-- ── 차트 패널 ──────────────────────────────────────────────── -->
  <article class="panel trends-chart-panel">
    <div class="trends-chart-meta">
      <div class="trends-meta-left">
        <span class="trends-resolution-badge" id="trendsResolutionBadge">5m</span>
        <span class="trends-time-label" id="trendsTimeLabel">—</span>
      </div>
      <span class="trends-point-hint">포인트 위에 마우스를 올리면 상세값을 확인할 수 있습니다</span>
    </div>
    <div class="trends-chart-wrap" id="trendsChartWrap">
      <canvas id="trendsChart"></canvas>
      <div class="trends-skeleton" id="trendsSkeleton" hidden>
        <div class="trends-skeleton-shimmer"></div>
      </div>
      <div class="trends-empty" id="trendsEmpty" hidden>
        <div class="trends-empty-icon">⌁</div>
        <p>표시할 채널이 없습니다</p>
        <span class="trends-empty-hint">하단 스탯 카드를 클릭하여 채널을 표시하세요</span>
      </div>
    </div>
  </article>

  <!-- ── 채널 스탯 카드 ─────────────────────────────────────────── -->
  <div class="trends-stats-row" id="trendsStatsRow"></div>


</section>
